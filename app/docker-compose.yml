services:
  app1:
    build: .
    image: fleet-app
    hostname: app1
    environment:
      APP_VERSION: v1
  app2:
    image: fleet-app
    hostname: app2
    environment:
      APP_VERSION: v1
  nginx:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [app1, app2]
